name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python syntax check
        run: |
          python -m py_compile spark_jobs/*.py streaming/*.py dags/*.py
      - name: Run simple static checks
        run: |
          python -m pip install pylint
          pylint --disable=all --enable=syntax-error spark_jobs/*.py streaming/*.py dags/*.py
